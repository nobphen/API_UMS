services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ums
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # File storage (MinIO) is not used yet. The minio/minio image is no longer published on Docker Hub,
  # so add a working MinIO / S3-compatible image here when the file upload feature is built.
  # minio:
  #   image: <minio-compatible-image>
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - miniodata:/data

volumes:
  pgdata:
  # miniodata:
