spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ums}
    username: ${DB_USERNAME:ums}
    password: ${DB_PASSWORD:ums}
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/testdata
    out-of-order: true   # testdata is V1000+, so a later db/migration script (V4, V5…) still runs after it

logging:
  level:
    com.ums: DEBUG

ums:
  password-reset:
    log-code: true   # no mail server locally: the reset code is written to the log instead
  otp:
    log-code: true   # no SMS gateway locally: the login code is written to the log instead
