spring:
  application:
    name: ums
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false   # Redis is used via RedisTemplate only; all repositories are JPA
    web:
      pageable:
        one-indexed-parameters: true   # ?page=1 is the first page (PageResponse answers page 1 too)
        max-page-size: 100             # ?size=100000 is cut to 100, so one call can't load a whole table
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:              # uploads: the biggest file Spring accepts at all (each feature checks its own limit, photo = 2 MB)
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ums:
  default-language: ${DEFAULT_LANGUAGE:en}   # API language when the app sends no Accept-Language and nobody is logged in (km or en)
  first-admin:          # only used when no SUPER_ADMIN exists yet (a new server); see FirstAdminSetup
    username: ${UMS_ADMIN_USERNAME:}
    password: ${UMS_ADMIN_PASSWORD:}
    email: ${UMS_ADMIN_EMAIL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
    key-id: ${JWT_KEY_ID:ums-key-1}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  storage:             # uploaded files: photos now, documents later (FileStorageService → S3FileStorageService)
    s3:                # any S3 server: RustFS (docker-compose, dev), Amazon S3, Cloudflare R2 (production)
      endpoint: ${S3_ENDPOINT:http://localhost:9000}            # where Spring Boot uploads
      public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}   # what the app opens (phone: http://<PC IP>:9000)
      region: ${S3_REGION:us-east-1}      # RustFS ignores it; Amazon needs the real one
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:ums}            # created by the app on the first upload
      link-ttl: ${S3_LINK_TTL:15m}        # a photo link stops working after this; the app asks again
  session:
    cleanup-cron: "0 0 3 * * *"
  mail:
    from: ${MAIL_FROM:no-reply@ums.local}   # sender address of every email (MailService)
  password-reset:
    code-ttl: 10m
    max-attempts: 5
    log-code: false   # dev only: write the code to the log when no mail server is set up
  otp:                # login with a code sent by SMS (/api/v1/auth/otp/*)
    code-ttl: 5m
    max-attempts: 5
    log-code: false   # dev only: write the code to the log while no SMS gateway is set up
  email-verify:       # applicants verify their email after sign-up (/api/v1/auth/verify-email)
    code-ttl: 15m
    max-attempts: 5
    log-code: false   # dev only: write the code to the log when no mail server is set up
