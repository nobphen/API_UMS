spring:
  application:
    name: ums
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false   # Redis is used via RedisTemplate only; all repositories are JPA
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ums:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
    key-id: ${JWT_KEY_ID:ums-key-1}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:ums}
  session:
    cleanup-cron: "0 0 3 * * *"
  password-reset:
    code-ttl: 10m
    max-attempts: 5
    mail-from: ${MAIL_FROM:no-reply@ums.local}
    log-code: false   # dev only: write the code to the log when no mail server is set up
