# Connection settings come from environment variables (see .env.example).
# The defaults below point to a local ums_uat database for running this profile on your machine.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ums_uat}
    username: ${DB_USERNAME:ums}
    password: ${DB_PASSWORD:ums}
  jpa:
    show-sql: false

logging:
  level:
    com.ums: INFO
